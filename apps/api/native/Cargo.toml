
[package]
authors = ["Firecrawl"]
edition = "2021"
name = "firecrawl_rs"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
anydoc = "0.1.9"
chrono = { version = "0.4", features = ["serde"] }
kuchikiki = "0.8.2"
lol_html = "2.6.0"
pdf-inspector = "1.14.2"
napi = { version = "3.0.0", features = ["serde-json", "tokio_rt"] }
napi-derive = "3.0.0"
nodesig = { git = "https://github.com/firecrawl/nodesig" }
psl = "2.1.140"
regex = "1.11.2"
roxmltree = "0.20.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
strsim = "0.11"
texting_robots = "0.2.2"
url = "2.5.7"
tokio = "1.48.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "debuginfo"
