# Today's self-hosted Firecrawl from its published images, default config
# (no auth, no AI, no proxy). Mirrors the repo's root docker-compose.yaml, minus
# the optional FoundationDB services. ALLOW_LOCAL_WEBHOOKS is on only so it can
# reach the benchmark corpus served from the host.
name: fcbench
x-env: &env
  REDIS_URL: redis://redis:6379
  REDIS_RATE_LIMIT_URL: redis://redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
  POSTGRES_HOST: nuq-postgres
  POSTGRES_PORT: "5432"
  USE_DB_AUTHENTICATION: "false"
  NUM_WORKERS_PER_QUEUE: "8"
  CRAWL_CONCURRENT_REQUESTS: "10"
  MAX_CONCURRENT_JOBS: "5"
  BROWSER_POOL_SIZE: "5"
  ALLOW_LOCAL_WEBHOOKS: "true"
  LOGGING_LEVEL: "warn"
services:
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: "3000"
      ALLOW_LOCAL_WEBHOOKS: "true"
      MAX_CONCURRENT_PAGES: "10"
    extra_hosts: ["host.docker.internal:host-gateway"]
  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    environment:
      <<: *env
      HOST: 0.0.0.0
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: "120000"
      ENV: local
    depends_on:
      redis: { condition: service_started }
      playwright-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      nuq-postgres: { condition: service_healthy }
    ports: ["127.0.0.1:3002:3002"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: node dist/src/harness.js --start-docker
    ulimits: { nofile: { soft: 65535, hard: 65535 } }
  redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
