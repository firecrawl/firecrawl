name: Publish JS SDK

on:
  push:
    branches:
      - main
    paths:
      - apps/js-sdk/firecrawl/package.json
  workflow_dispatch:

env:
  TEST_API_KEY: ${{ secrets.TEST_API_KEY }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: './apps/js-sdk/firecrawl/pnpm-lock.yaml'
      - name: Publish
        run: |
          pnpm install
          pnpm run build
          pnpm publish --access public --no-git-checks
          sed -i 's/"name": "@mendable\/firecrawl-js"/"name": "@mendable\/firecrawl"/g' package.json
          pnpm publish --access public --no-git-checks
          sed -i 's/"name": "@mendable\/firecrawl"/"name": "firecrawl"/g' package.json
          sed -i '/"firecrawl":/d' package.json
          pnpm publish --access public --no-git-checks
        working-directory: ./apps/js-sdk/firecrawl
