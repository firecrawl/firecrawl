name: Publish JS SDK

on:
  push:
    branches:
      - main
    paths:
      - apps/js-sdk/firecrawl/package.json
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
    defaults:
      run:
        working-directory: ./apps/js-sdk/firecrawl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Pack the three package names
        id: pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/dist"
          npm pkg set name=firecrawl
          npm pkg delete dependencies.firecrawl
          pnpm pack --pack-destination "$RUNNER_TEMP/dist"
          npm pkg set name=@mendable/firecrawl-js dependencies.firecrawl=$VERSION
          pnpm pack --pack-destination "$RUNNER_TEMP/dist"
          npm pkg set name=@mendable/firecrawl
          pnpm pack --pack-destination "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: js-sdk-dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  supersede:
    name: Supersede unapproved runs
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/supersede-waiting-runs
        continue-on-error: true
        timeout-minutes: 2

  release-summary:
    name: Release summary
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/release-summary
        continue-on-error: true
        timeout-minutes: 3
        with:
          gated-job: Publish
          version: firecrawl, @mendable/firecrawl-js and @mendable/firecrawl ${{ needs.build.outputs.version }}
          paths: apps/js-sdk/firecrawl

  publish:
    name: Publish
    needs: [build, release-summary]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: js-sdk-dist
          path: dist
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for name in firecrawl @mendable/firecrawl-js @mendable/firecrawl; do
            file="dist/$(echo "$name" | sed 's#^@##; s#/#-#')-$VERSION.tgz"
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is already on npm; skipping"
              continue
            fi
            npm publish "$file" --provenance --access public
          done
