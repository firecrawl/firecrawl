name: Firecrawl Local Test Suite

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/local/**
      - apps/api/native/src/**
      - .github/workflows/test-local.yml

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/local/target
          key: ${{ runner.os }}-cargo-local-${{ hashFiles('apps/local/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-local-

      # Firecrawl Local compiles the API's native cleaning code directly, so this
      # also checks those shared files.
      - name: Check formatting
        working-directory: ./apps/local
        run: cargo fmt --check

      - name: Build
        working-directory: ./apps/local
        run: cargo build --locked

      - name: Run unit tests
        working-directory: ./apps/local
        run: cargo test --locked

      # Test the actual archive and normalized manifest, including registry
      # dependencies, rather than a copy of the repository manifest.
      - name: Build and test the packaged crate
        working-directory: ./apps/local
        run: |
          ./scripts/vendor-native.sh
          cargo package --no-verify --allow-dirty
          out="$RUNNER_TEMP/firecrawl-local-package"
          mkdir -p "$out"
          tar -xzf target/package/firecrawl-local-*.crate -C "$out" --strip-components=1
          test -f "$out/src/native/html.rs"
          # Keep repository build-script output out of the packaged build.
          CARGO_TARGET_DIR="$out/target" cargo test --locked --manifest-path "$out/Cargo.toml"
