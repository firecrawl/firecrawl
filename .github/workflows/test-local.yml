name: Firecrawl Local Test Suite

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/local/**
      - apps/api/native/src/**
      - .github/workflows/test-local.yml
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - .clinerules
      - .github/copilot-instructions.md
      - .github/scripts/check-agent-routing.sh

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the agent instruction files match
        run: .github/scripts/check-agent-routing.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/local/target
          key: ${{ runner.os }}-cargo-local-${{ hashFiles('apps/local/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-local-

      # Firecrawl Local compiles the API's native cleaning code directly, so this
      # also checks those shared files.
      - name: Check formatting
        working-directory: ./apps/local
        run: cargo fmt --check

      - name: Build
        working-directory: ./apps/local
        run: cargo build --locked

      - name: Run unit tests
        working-directory: ./apps/local
        run: cargo test --locked

      # A published crate carries a copy of the shared code instead of reaching
      # into apps/api/native/src. Build from that file set, away from the
      # repository, so a release is never the first time it is tried.
      - name: Build from the packaged files
        working-directory: ./apps/local
        run: |
          ./scripts/vendor-native.sh
          out="$RUNNER_TEMP/firecrawl-local-package"
          mkdir -p "$out"
          cargo package --list --allow-dirty \
            | grep -v -e '^\.cargo_vcs_info\.json$' -e '^Cargo\.toml\.orig$' \
            | while read -r file; do
                mkdir -p "$out/$(dirname "$file")"
                cp "$file" "$out/$file"
              done
          test -f "$out/src/native/html.rs"
          CARGO_TARGET_DIR="$PWD/target" cargo build --locked --manifest-path "$out/Cargo.toml"
