name: Publish Rust SDK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/rust-sdk/**'

permissions: {}

jobs:
  build:
    name: Build and package
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version_check.outputs.publish }}
      crate_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install version check dependencies
        run: |
          python -m pip install --no-cache-dir -r .github/pip-bootstrap.txt
          pip install requests==2.34.2 packaging==26.3 toml==0.10.2

      - name: Run version check script
        id: version_check
        run: |
          VERSION_INCREMENTED=$(python .github/scripts/check_version_has_incremented.py rust ./apps/rust-sdk firecrawl)
          echo "publish=$VERSION_INCREMENTED" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.version_check.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Package
        id: package
        if: steps.version_check.outputs.publish == 'true'
        working-directory: ./apps/rust-sdk
        run: |
          cargo package --allow-dirty
          crate=$(ls target/package/*.crate)
          echo "sha256=$(sha256sum "$crate" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/dist" && cp "$crate" "$RUNNER_TEMP/dist/"

      - name: Build
        if: steps.version_check.outputs.publish == 'true'
        working-directory: ./apps/rust-sdk
        run: cargo build --release

      - name: Run tests
        if: steps.version_check.outputs.publish == 'true'
        working-directory: ./apps/rust-sdk
        run: cargo test --lib

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version_check.outputs.publish == 'true'
        with:
          name: rust-sdk-crate
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to crates.io
    needs: build
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-sdk-crate
          path: ${{ runner.temp }}/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      # cargo publish uploads what cargo package produces from this commit; refuse
      # unless that is byte-identical to the crate the build job tested.
      - name: Check the crate matches the build
        working-directory: ./apps/rust-sdk
        env:
          EXPECTED: ${{ needs.build.outputs.crate_sha256 }}
        run: |
          cargo package --no-verify --allow-dirty
          actual=$(sha256sum target/package/*.crate | cut -d' ' -f1)
          artifact=$(sha256sum "$RUNNER_TEMP"/dist/*.crate | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ] || [ "$artifact" != "$EXPECTED" ]; then
            echo "::error::Crate mismatch: build $EXPECTED, artifact $artifact, publish $actual"
            exit 1
          fi

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        working-directory: ./apps/rust-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-verify --allow-dirty
