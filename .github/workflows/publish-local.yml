name: Publish Firecrawl Local

# Publishes the firecrawl-local crate to crates.io with trusted publishing
# when the version in apps/local/Cargo.toml is newer than the published one.
#
# crates.io setup (once, by a crate owner): the first version is published by
# hand, because trusted publishing only works for a crate that already exists.
# Then add a trusted publisher under the crate's settings with repository
# firecrawl/firecrawl, workflow publish-local.yml and environment release.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/local/**'

permissions: {}

jobs:
  build:
    name: Build and package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      crate_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install version check dependencies
        run: |
          python -m pip install --no-cache-dir -r .github/pip-bootstrap.txt
          pip install requests==2.34.2 packaging==26.3 toml==0.10.2

      - name: Run version check script
        id: version_check
        run: |
          VERSION_INCREMENTED=$(python .github/scripts/check_version_has_incremented.py rust ./apps/local firecrawl-local)
          echo "publish=$VERSION_INCREMENTED" >> "$GITHUB_OUTPUT"

      # Trusted publishing cannot create a crate. Until the first version is
      # published by hand, there is nothing for this workflow to do.
      - name: Check the crate exists on crates.io
        id: gate
        env:
          VERSION_INCREMENTED: ${{ steps.version_check.outputs.publish }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'firecrawl-version-check' https://crates.io/api/v1/crates/firecrawl-local)
          if [ "$status" = "404" ]; then
            echo "::notice::firecrawl-local is not on crates.io yet. Publish the first version by hand (see apps/local/README.md), then this workflow takes over."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" != "200" ]; then
            echo "::error::crates.io answered $status when asked about firecrawl-local"
            exit 1
          else
            echo "publish=$VERSION_INCREMENTED" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.gate.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      # A published crate cannot reach apps/api/native/src, so it carries a copy.
      - name: Copy the shared cleaning code into the crate
        if: steps.gate.outputs.publish == 'true'
        working-directory: ./apps/local
        run: ./scripts/vendor-native.sh

      # cargo package builds the crate from the packaged files alone, which is
      # what `cargo install firecrawl-local` will do.
      - name: Package
        id: package
        if: steps.gate.outputs.publish == 'true'
        working-directory: ./apps/local
        run: |
          cargo package --allow-dirty
          crate=$(ls target/package/*.crate)
          echo "sha256=$(sha256sum "$crate" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/dist" && cp "$crate" "$RUNNER_TEMP/dist/"

      - name: Run tests
        if: steps.gate.outputs.publish == 'true'
        working-directory: ./apps/local
        run: cargo test --locked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.gate.outputs.publish == 'true'
        with:
          name: firecrawl-local-crate
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  supersede:
    name: Supersede unapproved runs
    needs: build
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/supersede-waiting-runs
        continue-on-error: true
        timeout-minutes: 2

  release-summary:
    name: Release summary
    needs: build
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Read the version
        id: version
        continue-on-error: true
        run: |
          echo "version=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' apps/local/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/release-summary
        continue-on-error: true
        timeout-minutes: 3
        with:
          gated-job: Publish to crates.io
          version: firecrawl-local ${{ steps.version.outputs.version }}
          paths: apps/local

  publish:
    name: Publish to crates.io
    needs: [build, release-summary]
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firecrawl-local-crate
          path: ${{ runner.temp }}/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Copy the shared cleaning code into the crate
        working-directory: ./apps/local
        run: ./scripts/vendor-native.sh

      # cargo publish uploads what cargo package produces from this commit; refuse
      # unless that is byte-identical to the crate the build job tested.
      - name: Check the crate matches the build
        working-directory: ./apps/local
        env:
          EXPECTED: ${{ needs.build.outputs.crate_sha256 }}
        run: |
          cargo package --no-verify --allow-dirty
          actual=$(sha256sum target/package/*.crate | cut -d' ' -f1)
          artifact=$(sha256sum "$RUNNER_TEMP"/dist/*.crate | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ] || [ "$artifact" != "$EXPECTED" ]; then
            echo "::error::Crate mismatch: build $EXPECTED, artifact $artifact, publish $actual"
            exit 1
          fi

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        working-directory: ./apps/local
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --no-verify --allow-dirty
