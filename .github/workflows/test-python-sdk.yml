name: Python SDK Test Suite

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/python-sdk/**
      - .github/workflows/test-python-sdk.yml
      - .github/pip-bootstrap.txt

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ./apps/python-sdk/requirements.txt

      - name: Install dependencies
        working-directory: ./apps/python-sdk
        run: |
          python -m pip install --no-cache-dir -r ../../.github/pip-bootstrap.txt
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        working-directory: ./apps/python-sdk
        run: python -m pytest firecrawl/__tests__/unit -q
