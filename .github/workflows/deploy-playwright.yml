name: Deploy Playwright to GHCR

on:
  push:
    branches:
      - main
    paths:
      - apps/playwright-service-ts/**
      - .github/workflows/deploy-playwright.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - platform: linux/arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    defaults:
      run:
        working-directory: './apps/playwright-service-ts'
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@ef12d5b165b596e3aa44ea8198d8fde563eab402 # v1

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Lowercase Repo Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'

      - name: Extract platform suffix
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_SUFFIX=${platform//\//-}" >> $GITHUB_ENV

      - name: Resolve short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: 'Build and Push Image'
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: ./apps/playwright-service-ts
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/playwright-service:${{ env.PLATFORM_SUFFIX }}
            ghcr.io/${{ env.REPO_OWNER }}/playwright-service:sha-${{ env.SHORT_SHA }}-${{ env.PLATFORM_SUFFIX }}
          platforms: ${{ matrix.platform }}
          provenance: false

  manifest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: build
    permissions:
      packages: write
    steps:
      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Lowercase Repo Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'

      - name: Resolve short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: 'Create and Push Multi-Arch Manifests'
        run: |
          set -euo pipefail
          image=ghcr.io/${{ env.REPO_OWNER }}/playwright-service
          for tag in "sha-${SHORT_SHA}" latest; do
            docker manifest create "${image}:${tag}" \
              "${image}:sha-${SHORT_SHA}-linux-amd64" \
              "${image}:sha-${SHORT_SHA}-linux-arm64"
            docker manifest push "${image}:${tag}"
          done
