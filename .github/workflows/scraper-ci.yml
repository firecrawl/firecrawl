name: scraper-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/cli/scraper/**"
      - ".github/workflows/scraper-ci.yml"
  pull_request:
    paths:
      - "apps/cli/scraper/**"
      - ".github/workflows/scraper-ci.yml"

env:
  NODE_VERSION: "22"

jobs:
  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli/scraper
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/cli/scraper/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/cli/scraper/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm exec oxfmt --check .

      - name: Lint
        run: pnpm exec oxlint .

      - name: Typecheck
        run: pnpm exec tsgo --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build
