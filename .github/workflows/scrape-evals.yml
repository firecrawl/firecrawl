name: Scrape Evals
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]

permissions: {}

jobs:
  quality-eval:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '#scrape-quality-eval')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.body, '#scrape-quality-eval') ||
        contains(github.event.pull_request.title, '#scrape-quality-eval')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Create evals App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SCRAPE_EVALS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCRAPE_EVALS_APP_PRIVATE_KEY }}
          repositories: scrape-evals
          permission-contents: write
          permission-members: read

      - name: Check org membership
        id: check-member
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            try {
              await github.rest.orgs.checkMembershipForUser({
                org: 'firecrawl',
                username: context.actor,
              });
              return true;
            } catch (error) {
              if (error.status === 404) return false;
              throw error;
            }

      - name: Dispatch quality eval
        if: steps.check-member.outputs.result == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            let pr = context.payload.pull_request;
            if (context.eventName !== 'pull_request') {
              const res = await fetch(
                `${process.env.GITHUB_API_URL}/repos/${context.repo.owner}/${context.repo.repo}/pulls/${context.issue.number}`,
                {
                  headers: {
                    authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                    accept: 'application/vnd.github+json',
                  },
                },
              );
              if (!res.ok) throw new Error(`PR lookup failed: ${res.status}`);
              pr = await res.json();
            }
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo?.full_name !== thisRepo) {
              core.setFailed('Evals only run for branches in this repository.');
              return;
            }
            if (!/^[A-Za-z0-9][A-Za-z0-9._\/-]{0,254}$/.test(pr.head.ref) || !/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              core.setFailed('Unsupported branch name or commit SHA.');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'firecrawl',
              repo: 'scrape-evals',
              event_type: 'firecrawl-pr-eval',
              client_payload: {
                pr_number: pr.number,
                pr_branch: pr.head.ref,
                commit_sha: pr.head.sha,
                repo: thisRepo,
              },
            });

  ocr-eval:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '#scrape-ocr-eval')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.body, '#scrape-ocr-eval') ||
        contains(github.event.pull_request.title, '#scrape-ocr-eval')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Create evals App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SCRAPE_EVALS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCRAPE_EVALS_APP_PRIVATE_KEY }}
          repositories: scrape-evals
          permission-contents: write
          permission-members: read

      - name: Check org membership
        id: check-member
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            try {
              await github.rest.orgs.checkMembershipForUser({
                org: 'firecrawl',
                username: context.actor,
              });
              return true;
            } catch (error) {
              if (error.status === 404) return false;
              throw error;
            }

      - name: Dispatch OCR eval
        if: steps.check-member.outputs.result == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            let pr = context.payload.pull_request;
            if (context.eventName !== 'pull_request') {
              const res = await fetch(
                `${process.env.GITHUB_API_URL}/repos/${context.repo.owner}/${context.repo.repo}/pulls/${context.issue.number}`,
                {
                  headers: {
                    authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                    accept: 'application/vnd.github+json',
                  },
                },
              );
              if (!res.ok) throw new Error(`PR lookup failed: ${res.status}`);
              pr = await res.json();
            }
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo?.full_name !== thisRepo) {
              core.setFailed('Evals only run for branches in this repository.');
              return;
            }
            if (!/^[A-Za-z0-9][A-Za-z0-9._\/-]{0,254}$/.test(pr.head.ref) || !/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              core.setFailed('Unsupported branch name or commit SHA.');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'firecrawl',
              repo: 'scrape-evals',
              event_type: 'firecrawl-ocr-eval',
              client_payload: {
                pr_number: pr.number,
                pr_branch: pr.head.ref,
                commit_sha: pr.head.sha,
                repo: thisRepo,
              },
            });
