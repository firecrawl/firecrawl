name: Scrape Evals
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]

permissions: {}

jobs:
  quality-eval:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '#scrape-quality-eval')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.body, '#scrape-quality-eval') ||
        contains(github.event.pull_request.title, '#scrape-quality-eval')))
    runs-on: ubuntu-latest
    steps:
      - name: Check org membership
        id: check-member
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.SCRAPE_EVALS_PAT }}
          script: |
            try {
              await github.rest.orgs.checkMembershipForUser({
                org: 'firecrawl',
                username: context.actor,
              });
              return true;
            } catch {
              return false;
            }

      - name: Dispatch quality eval
        if: steps.check-member.outputs.result == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.SCRAPE_EVALS_PAT }}
          script: |
            let pr = context.payload.pull_request;
            if (context.eventName !== 'pull_request') {
              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }));
            }
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo?.full_name !== thisRepo) {
              core.setFailed('Evals only run for branches in this repository.');
              return;
            }
            if (!/^[A-Za-z0-9][A-Za-z0-9._\/-]{0,254}$/.test(pr.head.ref) || !/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              core.setFailed('Unsupported branch name or commit SHA.');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'firecrawl',
              repo: 'scrape-evals',
              event_type: 'firecrawl-pr-eval',
              client_payload: {
                pr_number: pr.number,
                pr_branch: pr.head.ref,
                commit_sha: pr.head.sha,
                repo: thisRepo,
              },
            });

  ocr-eval:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '#scrape-ocr-eval')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.body, '#scrape-ocr-eval') ||
        contains(github.event.pull_request.title, '#scrape-ocr-eval')))
    runs-on: ubuntu-latest
    steps:
      - name: Check org membership
        id: check-member
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.SCRAPE_EVALS_PAT }}
          script: |
            try {
              await github.rest.orgs.checkMembershipForUser({
                org: 'firecrawl',
                username: context.actor,
              });
              return true;
            } catch {
              return false;
            }

      - name: Dispatch OCR eval
        if: steps.check-member.outputs.result == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.SCRAPE_EVALS_PAT }}
          script: |
            let pr = context.payload.pull_request;
            if (context.eventName !== 'pull_request') {
              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }));
            }
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo?.full_name !== thisRepo) {
              core.setFailed('Evals only run for branches in this repository.');
              return;
            }
            if (!/^[A-Za-z0-9][A-Za-z0-9._\/-]{0,254}$/.test(pr.head.ref) || !/^[0-9a-f]{40}$/.test(pr.head.sha)) {
              core.setFailed('Unsupported branch name or commit SHA.');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: 'firecrawl',
              repo: 'scrape-evals',
              event_type: 'firecrawl-ocr-eval',
              client_payload: {
                pr_number: pr.number,
                pr_branch: pr.head.ref,
                commit_sha: pr.head.sha,
                repo: thisRepo,
              },
            });
