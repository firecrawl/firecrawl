name: JS SDK Test Suite

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/js-sdk/firecrawl/**
      - .github/workflows/test-js-sdk.yml

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: './apps/js-sdk/firecrawl/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./apps/js-sdk/firecrawl
      - name: Run next URL pinning unit tests
        run: pnpm exec jest --verbose src/__tests__/unit/v1/next-url-pinning.test.ts src/__tests__/unit/v2/next-url-pinning.test.ts
        working-directory: ./apps/js-sdk/firecrawl
        env:
          NODE_OPTIONS: --experimental-vm-modules

  test:
    name: Run tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      IDMUX_URL: ${{ secrets.IDMUX_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: './apps/js-sdk/firecrawl/pnpm-lock.yaml'
      - name: Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: 'true'
      - name: Install dependencies
        run: pnpm install
        working-directory: ./apps/js-sdk/firecrawl
      - name: Build
        run: pnpm run build
        working-directory: ./apps/js-sdk/firecrawl
      - name: Run tests
        run: pnpm run test
        working-directory: ./apps/js-sdk/firecrawl
